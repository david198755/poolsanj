name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Cache debug keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: poolsanj-debug-keystore-v1

      - name: Generate debug keystore
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PoolSanj,OU=Debug,O=artin,L=Tehran,ST=IR,C=IR"

      - name: Verify keystore
        run: |
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey
          echo "Keystore verified OK"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PoolSanj-debug
          path: app/build/outputs/apk/debug/app-debug.apk
